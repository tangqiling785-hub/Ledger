<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的账本</title>
  <style>
    /* 全局基础设置 */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: #F2F2F7; 
      color: #1C1C1E;
      font-size: 16px;
      line-height: 1.4;
    }
    
    /* 顶部导航 */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    
    /* 语言选择器 */
    .lang-select {
      background: transparent;
      border: none;
      color: #007AFF;
      font-size: 16px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      padding: 4px;
      -webkit-appearance: none;
      text-align: right;
    }

    /* 主容器 */
    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    /* 纯白卡片 */
    .card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.03);
    }
    .card h2 {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 700;
      color: #1C1C1E;
    }

    /* 表单元素 */
    form { display: grid; gap: 14px; }
    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #8E8E93;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      font: inherit;
      font-size: 16px;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      background: #F2F2F7; 
      color: #1C1C1E;
      outline: none;
      transition: box-shadow 0.2s;
      -webkit-appearance: none;
    }
    input:focus, select:focus {
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2); 
      background: #FFFFFF;
    }
    .row { display: flex; gap: 10px; }
    .row input { flex: 1; }
    .row select { width: 100px; }
    
    /* iOS 风格大按钮 */
    button.primary {
      background: #007AFF;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.2s;
    }
    button.primary:active { opacity: 0.8; }
    
    button.secondary {
      background: #FFFFFF;
      color: #007AFF;
      border: 1px solid #007AFF;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button.secondary:active { background: #F2F2F7; }

    /* 资产概览区 */
    .split-container { display: flex; gap: 12px; }
    .split-box { flex: 1; padding: 16px; border-radius: 16px; text-align: center; }
    .box-hkd { background: #F0F8FF; } 
    .box-rmb { background: #FFF8F0; } 
    .split-box h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: #666; }
    
    .asset-title { font-size: 12px; color: #8E8E93; margin-bottom: 4px; font-weight: 500;}
    .asset-val { font-size: 24px; font-weight: 800; color: #1C1C1E; letter-spacing: -0.5px; }
    .expense-val { font-size: 20px; font-weight: 700; color: #FF3B30; } 

    /* 折叠按钮 */
    .toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
      background: #F2F2F7;
      color: #007AFF;
      font-weight: 600;
      font-size: 15px;
      border: none;
      border-radius: 12px;
      margin-top: 16px;
      cursor: pointer;
    }
    .toggle-btn:active { background: #E5E5EA; }

    /* 账户明细列表（浅色交替） */
    .account-list {
      list-style: none;
      padding: 0;
      margin: 16px 0 0 0;
      display: grid;
      gap: 1px; 
      border-radius: 12px;
      overflow: hidden;
    }
    .account-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      color: #333;
    }
    .account-list li:nth-child(odd) { background-color: #F8F9FA; }
    .account-list li:nth-child(even) { background-color: #FFFFFF; border: 1px solid #F2F2F7; border-left: none; border-right: none; }
    
    .account-list .acc-title { font-weight: 600; font-size: 15px; }
    .account-list .acc-bal { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
    .account-list .acc-bal.negative { color: #FF3B30; }

    /* 账单列表 */
    .list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    .list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #F2F2F7;
    }
    .list li:last-child { border-bottom: none; padding-bottom: 0; }
    .list .item-title { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
    .list .meta { color: #8E8E93; font-size: 13px; }
    .list .money { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .list .money.expense { color: #1C1C1E; } 
    .list .money.income { color: #34C759; } 
    .list .money.transfer { color: #007AFF; font-size: 16px;}

    .empty { color: #8E8E93; font-size: 14px; text-align: center; margin: 20px 0 0; }

    /* 余额编辑器样式 */
    .balance-editor { margin-top: 16px; display: grid; gap: 8px; }
    .balance-editor .editor-row { display: flex; align-items: center; gap: 8px; }
    .balance-editor .editor-row span { flex: 1; font-size: 14px; }
    .balance-editor input { width: 120px; padding: 10px; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1 data-i18n="title">我的账本</h1>
    <select id="langSelect" class="lang-select">
      <option value="zh-CN">简</option>
      <option value="zh-TW">繁</option>
      <option value="en">EN</option>
    </select>
  </header>

  <main>
    <!-- 资产概览 -->
    <section class="card">
      <h2 data-i18n="overview">资产概览</h2>
      <div class="split-container">
        <div class="split-box box-hkd">
          <h3 data-i18n="hkdAccount">HKD 账户</h3>
          <div class="asset-title" data-i18n="totalAssets">总资产</div>
          <div class="asset-val" id="totalAssetsHKD">0.00</div>
          <div class="asset-title" style="margin-top: 12px;" data-i18n="monthExpense">本月支出</div>
          <div class="expense-val" id="monthSummaryHKD">0.00</div>
        </div>
        <div class="split-box box-rmb">
          <h3 data-i18n="rmbAccount">RMB 账户</h3>
          <div class="asset-title" data-i18n="totalAssets">总资产</div>
          <div class="asset-val" id="totalAssetsRMB">0.00</div>
          <div class="asset-title" style="margin-top: 12px;" data-i18n="monthExpense">本月支出</div>
          <div class="expense-val" id="monthSummaryRMB">0.00</div>
        </div>
      </div>
      
      <button id="toggleAccountsBtn" class="toggle-btn" data-i18n="expand">展开查看</button>
      
      <div id="accountsContainer" style="display: none;">
        <ul id="accountList" class="account-list"></ul>
        <button id="editBalanceBtn" class="secondary" style="margin-top: 16px;" data-i18n="setInitBalance">设置初始余额</button>
        <div id="balanceEditor" class="balance-editor" style="display:none;"></div>
      </div>
    </section>

    <!-- 记账 -->
    <section class="card">
      <h2 data-i18n="record">记账</h2>
      <form id="recordForm">
        <label><span data-i18n="amount">金额</span>
          <div class="row">
            <input type="number" id="amount" step="0.01" required placeholder="0.00">
            <select id="currency"><option value="HKD">HKD</option><option value="RMB">RMB</option></select>
          </div>
        </label>
        <label><span data-i18n="type">类型</span>
          <select id="type">
            <option value="expense" data-i18n="expense">支出</option>
            <option value="income" data-i18n="income">收入</option>
          </select>
        </label>
        <label><span data-i18n="account">账户</span>
          <select id="account"></select>
        </label>
        <label><span data-i18n="category">分类</span>
          <select id="category"></select>
        </label>
        <label><span data-i18n="date">日期</span>
          <input type="date" id="date" required>
        </label>
        <label><span data-i18n="note">备注</span>
          <input type="text" id="note" data-i18n-placeholder="notePlaceholder" placeholder="可选">
        </label>
        <button type="submit" class="primary" data-i18n="saveRecord">保存账单</button>
      </form>
    </section>

    <!-- 转账 -->
    <section class="card">
      <h2 data-i18n="transfer">转账 / 还款</h2>
      <form id="transferForm">
        <label><span data-i18n="from">从</span>
          <select id="fromAccount"></select>
        </label>
        <label><span data-i18n="to">到</span>
          <select id="toAccount"></select>
        </label>
        <label><span data-i18n="amount">金额</span>
          <div class="row">
            <input type="number" id="transferAmount" step="0.01" required placeholder="0.00">
            <select id="transferCurrency"><option value="HKD">HKD</option></select>
          </div>
        </label>
        <label><span data-i18n="date">日期</span>
          <input type="date" id="transferDate" required>
        </label>
        <label><span data-i18n="note">备注</span>
          <input type="text" id="transferNote" data-i18n-placeholder="notePlaceholder" placeholder="可选">
        </label>
        <button type="submit" class="primary" data-i18n="confirmTransfer">确认转账</button>
      </form>
    </section>

    <!-- 账单列表 -->
    <section class="card">
      <h2 data-i18n="billList">账单列表</h2>
      <ul id="list" class="list"></ul>
      <p id="emptyTip" class="empty" data-i18n="noRecords">还没有记录，先记一笔吧。</p>
    </section>

    <!-- 转账记录 -->
    <section class="card">
      <h2 data-i18n="transferList">转账记录</h2>
      <ul id="transferList" class="list"></ul>
      <p id="transferEmptyTip" class="empty" data-i18n="noTransfers">还没有转账记录。</p>
    </section>
  </main>

  <script>
    // ===== 多语言字典 =====
    const LANGS = {
      'zh-CN': {
        title: '我的账本', overview: '资产概览', hkdAccount: 'HKD 账户', rmbAccount: 'RMB 账户',
        totalAssets: '总资产', monthExpense: '本月支出', expand: '展开查看', collapse: '收起',
        setInitBalance: '设置初始余额', saveInitBalance: '保存初始余额',
        record: '记账', transfer: '转账 / 还款', amount: '金额', type: '类型', account: '账户', category: '分类', date: '日期', note: '备注',
        expense: '支出', income: '收入', saveRecord: '保存账单', confirmTransfer: '确认转账', from: '从', to: '到',
        billList: '账单列表', transferList: '转账记录', noRecords: '还没有记录，先记一笔吧。', noTransfers: '还没有转账记录。', notePlaceholder: '可选',
        categories: ['餐饮', '交通', '购物', '工资', '利息', '饮料', '其他'],
        accNames: {
          'hsbc-savings': '汇丰银行卡 · 存款', 'hsbc-fixed': '汇丰银行卡 · 定期',
          'hsb-savings': '恒生银行卡 · 存款', 'hsb-fixed': '恒生银行卡 · 定期',
          'octopus': '八达通', 'alipay-hk': 'Alipay 香港版', 'credit-card': '信用卡', 'cash-hkd': '港币现金',
          'alipay': '支付宝', 'wechat': '微信支付', 'ccb': '建设银行卡', 'icbc': '工商银行卡', 'cash-rmb': '人民币现金'
        }
      },
      'zh-TW': {
        title: '我的賬本', overview: '資產概覽', hkdAccount: 'HKD 賬戶', rmbAccount: 'RMB 賬戶',
        totalAssets: '總資產', monthExpense: '本月支出', expand: '展開查看', collapse: '收起',
        setInitBalance: '設定初始餘額', saveInitBalance: '儲存初始餘額',
        record: '記賬', transfer: '轉賬 / 還款', amount: '金額', type: '類型', account: '賬戶', category: '分類', date: '日期', note: '備註',
        expense: '支出', income: '收入', saveRecord: '儲存賬單', confirmTransfer: '確認轉賬', from: '從', to: '到',
        billList: '賬單列表', transferList: '轉賬記錄', noRecords: '還沒有記錄，先記一筆吧。', noTransfers: '還沒有轉賬記錄。', notePlaceholder: '可選',
        categories: ['餐飲', '交通', '購物', '工資', '利息', '飲料', '其他'],
        accNames: {
          'hsbc-savings': '匯豐銀行卡 · 存款', 'hsbc-fixed': '匯豐銀行卡 · 定期',
          'hsb-savings': '恒生銀行卡 · 存款', 'hsb-fixed': '恒生銀行卡 · 定期',
          'octopus': '八達通', 'alipay-hk': 'Alipay 香港版', 'credit-card': '信用卡', 'cash-hkd': '港幣現金',
          'alipay': '支付寶', 'wechat': '微信支付', 'ccb': '建設銀行卡', 'icbc': '工商銀行卡', 'cash-rmb': '人民幣現金'
        }
      },
      'en': {
        title: 'My Ledger', overview: 'Overview', hkdAccount: 'HKD Accounts', rmbAccount: 'RMB Accounts',
        totalAssets: 'Total Assets', monthExpense: 'Monthly Expense', expand: 'Expand', collapse: 'Collapse',
        setInitBalance: 'Set Initial Balance', saveInitBalance: 'Save Initial Balance',
        record: 'Record', transfer: 'Transfer / Repay', amount: 'Amount', type: 'Type', account: 'Account', category: 'Category', date: 'Date', note: 'Note',
        expense: 'Expense', income: 'Income', saveRecord: 'Save Record', confirmTransfer: 'Confirm Transfer', from: 'From', to: 'To',
        billList: 'Records', transferList: 'Transfers', noRecords: 'No records yet. Add one!', noTransfers: 'No transfers yet.', notePlaceholder: 'Optional',
        categories: ['Dining', 'Transport', 'Shopping', 'Salary', 'Interest', 'Drinks', 'Others'],
        accNames: {
          'hsbc-savings': 'HSBC · Savings', 'hsbc-fixed': 'HSBC · Fixed',
          'hsb-savings': 'Hang Seng · Savings', 'hsb-fixed': 'Hang Seng · Fixed',
          'octopus': 'Octopus', 'alipay-hk': 'Alipay HK', 'credit-card': 'Credit Card', 'cash-hkd': 'HKD Cash',
          'alipay': 'Alipay', 'wechat': 'WeChat Pay', 'ccb': 'CCB Card', 'icbc': 'ICBC Card', 'cash-rmb': 'RMB Cash'
        }
      }
    };

    let currentLang = localStorage.getItem('lang') || 'zh-CN';

    // 基础账户配置（去掉了写死的名字）
    const ACCOUNTS = [
      { id: 'hsbc-savings',  currency: 'HKD' },
      { id: 'hsbc-fixed',    currency: 'HKD' },
      { id: 'hsb-savings',   currency: 'HKD' },
      { id: 'hsb-fixed',     currency: 'HKD' },
      { id: 'octopus',       currency: 'HKD' },
      { id: 'alipay-hk',     currency: 'HKD' },
      { id: 'credit-card',   currency: 'HKD' },
      { id: 'cash-hkd',      currency: 'HKD' },
      { id: 'alipay',        currency: 'RMB' },
      { id: 'wechat',        currency: 'RMB' },
      { id: 'ccb',           currency: 'RMB' },
      { id: 'icbc',          currency: 'RMB' },
      { id: 'cash-rmb',      currency: 'RMB' }
    ];

    const TRANSFER_RULES = [{ from: 'hsbc-savings', to: 'credit-card' }];

    function loadRecords() { const raw = localStorage.getItem('records'); return raw ? JSON.parse(raw) : []; }
    function saveRecords(records) { localStorage.setItem('records', JSON.stringify(records)); }
    function loadTransfers() { const raw = localStorage.getItem('transfers'); return raw ? JSON.parse(raw) : []; }
    function saveTransfers(transfers) { localStorage.setItem('transfers', JSON.stringify(transfers)); }
    function loadInitialBalances() { const raw = localStorage.getItem('initialBalances'); return raw ? JSON.parse(raw) : {}; }
    function saveInitialBalances(balances) { localStorage.setItem('initialBalances', JSON.stringify(balances)); }
    
    function todayStr() {
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${d.getFullYear()}-${m}-${day}`;
    }
    function isThisMonth(dateStr) {
      const now = new Date();
      const prefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      return dateStr.startsWith(prefix);
    }

    function calcBalance(accountId, records, initialBalances) {
      const initial = initialBalances[accountId] || 0;
      const recordDelta = records.filter((r) => r.accountId === accountId).reduce((sum, r) => sum + (r.type === 'income' ? r.amount : -r.amount), 0);
      const transfers = loadTransfers();
      const transferDelta = transfers.reduce((sum, t) => {
        if (t.from === accountId) return sum - t.amount;
        if (t.to === accountId) return sum + t.amount;
        return sum;
      }, 0);
      return initial + recordDelta + transferDelta;
    }

    // ===== 渲染函数 =====
    function renderAccountOptions() {
      const select = document.getElementById('account');
      select.innerHTML = '';
      ACCOUNTS.forEach((acc) => {
        const opt = document.createElement('option');
        opt.value = acc.id;
        opt.textContent = `${LANGS[currentLang].accNames[acc.id]}（${acc.currency}）`;
        select.appendChild(opt);
      });
    }

    function renderCategoryOptions() {
      const select = document.getElementById('category');
      select.innerHTML = '';
      LANGS[currentLang].categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    function renderTransferOptions() {
      const fromSelect = document.getElementById('fromAccount');
      const toSelect = document.getElementById('toAccount');
      fromSelect.innerHTML = ''; toSelect.innerHTML = '';
      TRANSFER_RULES.forEach((rule) => {
        const fromAcc = ACCOUNTS.find((a) => a.id === rule.from);
        const toAcc = ACCOUNTS.find((a) => a.id === rule.to);
        if (fromAcc) { const opt = document.createElement('option'); opt.value = rule.from; opt.textContent = `${LANGS[currentLang].accNames[fromAcc.id]}（${fromAcc.currency}）`; fromSelect.appendChild(opt); }
        if (toAcc) { const opt = document.createElement('option'); opt.value = rule.to; opt.textContent = `${LANGS[currentLang].accNames[toAcc.id]}（${toAcc.currency}）`; toSelect.appendChild(opt); }
      });
    }

    function renderAccounts() {
      const records = loadRecords(); const initialBalances = loadInitialBalances();
      const listEl = document.getElementById('accountList'); 
      listEl.innerHTML = '';
      
      ACCOUNTS.forEach((acc) => {
        const balance = calcBalance(acc.id, records, initialBalances);
        const li = document.createElement('li');
        
        const title = document.createElement('div'); 
        title.className = 'acc-title';
        title.textContent = LANGS[currentLang].accNames[acc.id]; 
        
        const balDiv = document.createElement('div'); 
        balDiv.className = 'acc-bal' + (balance < 0 ? ' negative' : '');
        balDiv.textContent = `${acc.currency} ${balance.toFixed(2)}`; 
        
        li.appendChild(title); 
        li.appendChild(balDiv); 
        listEl.appendChild(li);
      });
    }

    function renderList() {
      const records = loadRecords();
      const listEl = document.getElementById('list'); const emptyTip = document.getElementById('emptyTip');
      listEl.innerHTML = '';
      const sorted = [...records].sort((a, b) => a.date === b.date ? b.createdAt - a.createdAt : (a.date < b.date ? 1 : -1));
      sorted.forEach((r) => {
        const acc = ACCOUNTS.find((a) => a.id === r.accountId);
        const li = document.createElement('li');
        const left = document.createElement('div');
        const title = document.createElement('div'); title.className = 'item-title'; title.textContent = `${r.category}${r.note ? ' · ' + r.note : ''}`;
        // 历史记录的账户名会实时根据当前语言翻译
        const metaName = acc ? LANGS[currentLang].accNames[acc.id] : '未知账户';
        const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = `${r.date} · ${metaName}`;
        left.appendChild(title); left.appendChild(meta);
        const money = document.createElement('div'); money.className = 'money ' + r.type;
        money.textContent = (r.type === 'expense' ? '-' : '+') + `${r.currency} ${r.amount.toFixed(2)}`;
        li.appendChild(left); li.appendChild(money); listEl.appendChild(li);
      });
      emptyTip.style.display = records.length ? 'none' : 'block';
    }

    function renderTransfers() {
      const transfers = loadTransfers();
      const listEl = document.getElementById('transferList'); const emptyTip = document.getElementById('transferEmptyTip');
      listEl.innerHTML = '';
      const sorted = [...transfers].sort((a, b) => b.createdAt - a.createdAt);
      sorted.forEach((t) => {
        const fromAcc = ACCOUNTS.find((a) => a.id === t.from); const toAcc = ACCOUNTS.find((a) => a.id === t.to);
        const li = document.createElement('li');
        const left = document.createElement('div');
        const fromName = fromAcc ? LANGS[currentLang].accNames[fromAcc.id] : t.from;
        const toName = toAcc ? LANGS[currentLang].accNames[toAcc.id] : t.to;
        const title = document.createElement('div'); title.className = 'item-title'; title.textContent = `${fromName} → ${toName}`;
        const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = `${t.date}${t.note ? ' · ' + t.note : ''}`;
        left.appendChild(title); left.appendChild(meta);
        const money = document.createElement('div'); money.className = 'money transfer'; money.textContent = `${t.currency} ${t.amount.toFixed(2)}`;
        li.appendChild(left); li.appendChild(money); listEl.appendChild(li);
      });
      emptyTip.style.display = transfers.length ? 'none' : 'block';
    }

    function renderTotalAssets() {
      const records = loadRecords();
      const initialBalances = loadInitialBalances();
      let totalHKD = 0; let totalRMB = 0;
      ACCOUNTS.forEach((acc) => {
        const balance = calcBalance(acc.id, records, initialBalances);
        if (acc.currency === 'HKD') totalHKD += balance;
        if (acc.currency === 'RMB') totalRMB += balance;
      });
      document.getElementById('totalAssetsHKD').textContent = totalHKD.toFixed(2);
      document.getElementById('totalAssetsRMB').textContent = totalRMB.toFixed(2);
    }

    function renderSummary() {
      const records = loadRecords();
      const monthExpense = (currency) => records.filter((r) => r.type === 'expense' && r.currency === currency && isThisMonth(r.date)).reduce((sum, r) => sum + r.amount, 0);
      document.getElementById('monthSummaryHKD').textContent = monthExpense('HKD').toFixed(2);
      document.getElementById('monthSummaryRMB').textContent = monthExpense('RMB').toFixed(2);
    }

    function render() { 
      renderAccounts(); 
      renderList(); 
      renderSummary(); 
      renderTransfers(); 
      renderTotalAssets();
    }

    function renderBalanceEditor() {
      const editor = document.getElementById('balanceEditor'); const initialBalances = loadInitialBalances();
      editor.innerHTML = '';
      ACCOUNTS.forEach((acc) => {
        const row = document.createElement('div'); row.className = 'editor-row';
        const label = document.createElement('span'); label.textContent = LANGS[currentLang].accNames[acc.id];
        const input = document.createElement('input'); input.type = 'number'; input.step = '0.01'; input.value = initialBalances[acc.id] || 0; input.dataset.accountId = acc.id;
        row.appendChild(label); row.appendChild(input); editor.appendChild(row);
      });
      const saveBtn = document.createElement('button'); saveBtn.className = 'primary'; saveBtn.textContent = LANGS[currentLang].saveInitBalance; saveBtn.style.marginTop = '10px';
      saveBtn.addEventListener('click', () => {
        const balances = {};
        editor.querySelectorAll('input[data-account-id]').forEach((input) => { balances[input.dataset.accountId] = parseFloat(input.value) || 0; });
        saveInitialBalances(balances); editor.style.display = 'none'; render();
      });
      editor.appendChild(saveBtn);
    }

    // ===== 多语言切换核心逻辑 =====
    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.getElementById('langSelect').value = lang;

      // 1. 替换静态文本
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (LANGS[lang][key]) {
          el.textContent = LANGS[lang][key];
        }
      });

      // 2. 替换占位符
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (LANGS[lang][key]) {
          el.placeholder = LANGS[lang][key];
        }
      });

      // 3. 重新渲染下拉框
      renderCategoryOptions();
      renderAccountOptions();
      renderTransferOptions();

      // 4. 保持折叠按钮的文字状态正确
      const container = document.getElementById('accountsContainer');
      const toggleBtn = document.getElementById('toggleAccountsBtn');
      toggleBtn.textContent = container.style.display === 'none' ? LANGS[lang].expand : LANGS[lang].collapse;

      // 5. 刷新所有列表数据（更新账户名）
      render();
    }

    // ===== 事件监听 =====
    
    // 语言切换
    document.getElementById('langSelect').addEventListener('change', function(e) {
      applyLanguage(e.target.value);
    });

    document.getElementById('toggleAccountsBtn').addEventListener('click', function() {
      const container = document.getElementById('accountsContainer');
      const isHidden = container.style.display === 'none';
      container.style.display = isHidden ? 'block' : 'none';
      this.textContent = isHidden ? LANGS[currentLang].collapse : LANGS[currentLang].expand;
    });

    document.getElementById('editBalanceBtn').addEventListener('click', function () {
      const editor = document.getElementById('balanceEditor');
      if (editor.style.display === 'none') { renderBalanceEditor(); editor.style.display = 'grid'; } else { editor.style.display = 'none'; }
    });

    document.getElementById('recordForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('amount').value);
      if (!amount || amount <= 0) { alert('请输入有效金额 / Please enter a valid amount'); return; }
      const accountId = document.getElementById('account').value;
      const account = ACCOUNTS.find((a) => a.id === accountId);
      const record = {
        id: Date.now(), amount: amount, currency: document.getElementById('currency').value, type: document.getElementById('type').value,
        accountId: accountId, accountName: LANGS[currentLang].accNames[accountId], category: document.getElementById('category').value,
        date: document.getElementById('date').value, note: document.getElementById('note').value.trim(), synced: false, createdAt: Date.now()
      };
      const records = loadRecords(); records.push(record); saveRecords(records);
      this.reset(); document.getElementById('date').value = todayStr(); render();
    });

    document.getElementById('transferForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('transferAmount').value);
      if (!amount || amount <= 0) { alert('请输入有效金额 / Please enter a valid amount'); return; }
      const from = document.getElementById('fromAccount').value; const to = document.getElementById('toAccount').value;
      const fromAcc = ACCOUNTS.find((a) => a.id === from); const toAcc = ACCOUNTS.find((a) => a.id === to);
      if (fromAcc && toAcc && fromAcc.currency !== toAcc.currency) { alert('不支持跨币种转账 / Cross-currency transfer not supported'); return; }
      const transfer = {
        id: Date.now(), from: from, to: to, amount: amount, currency: document.getElementById('transferCurrency').value,
        date: document.getElementById('transferDate').value, note: document.getElementById('transferNote').value.trim(), createdAt: Date.now(), synced: false
      };
      const transfers = loadTransfers(); transfers.push(transfer); saveTransfers(transfers);
      this.reset(); document.getElementById('transferDate').value = todayStr(); render();
    });

    // ===== 初始化 =====
    document.getElementById('date').value = todayStr();
    document.getElementById('transferDate').value = todayStr();
    
    // 加载上次选择的语言
    applyLanguage(currentLang);
  </script>
</body>
</html>
