<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的账本</title>
  <style>
    /* 全局基础设置 */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: #EEF4FF; 
      color: #1C1C1E;
      font-size: 16px;
      line-height: 1.4;
      padding-bottom: 90px; 
      transition: background-color 0.4s ease;
    }
    
    /* 顶部区域 */
    .topbar {
      position: absolute;
      top: 0; left: 0; width: 100%;
      padding: 15px 20px; 
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
      z-index: 100;
    }
    
    .top-btn, .lang-select {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(0,0,0,0.05);
      border-radius: 8px;
      color: #007AFF;
      font-size: 14px; font-weight: 600;
      height: 32px; 
      outline: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
      pointer-events: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .top-btn {
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .top-btn:active { opacity: 0.7; }

    .lang-select {
      width: 60px; 
      text-align: center;
      text-align-last: center; 
      padding: 0;
      -webkit-appearance: none;
    }

    /* 主容器 */
    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 65px 16px 20px; 
    }
    
    .page { display: none; }
    .page.active { display: block; animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* 纯白卡片 */
    .card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 24px 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04); 
    }
    
    /* 带隐藏按钮的标题 */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .card-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #1C1C1E;
    }
    
    /* 极简文字按钮 */
    .text-btn {
      background: transparent;
      border: 1px solid #007AFF;
      color: #007AFF;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .text-btn:active { background: #F0F8FF; }

    .card h2 { margin: 0 0 20px; font-size: 18px; font-weight: 700; color: #1C1C1E; }

    /* 表单元素 */
    form { display: grid; gap: 16px; width: 88%; margin: 0 auto; }
    label {
      display: grid; gap: 6px; font-size: 13px; font-weight: 600;
      color: #8E8E93; text-transform: uppercase; letter-spacing: 0.5px; text-align: left; 
    }
    input, select, textarea {
      font: inherit; font-size: 16px; padding: 14px 16px;
      border: none; border-radius: 12px; background: #F2F2F7; 
      color: #1C1C1E; outline: none; transition: box-shadow 0.2s;
      -webkit-appearance: none; text-align: left; width: 100%; 
    }
    input[type="date"] { display: flex; align-items: center; justify-content: flex-start; text-align: left !important; -webkit-appearance: none; }
    input[type="date"]::-webkit-date-and-time-value { text-align: left !important; width: 100%; }
    input[type="date"]::-webkit-datetime-edit { text-align: left !important; width: 100%; }
    input[type="date"]::-webkit-calendar-picker-indicator { position: absolute; right: 16px; height: 100%; width: 30px; opacity: 0; }

    input:focus, select:focus, textarea:focus { box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2); background: #FFFFFF; }
    
    .row { display: flex; gap: 10px; width: 100%; }
    .row input { flex: 1; }
    .row select { width: 100px; text-align: center; flex-shrink: 0; } 
    
    /* 按钮 */
    button.primary {
      background: #007AFF; color: #FFFFFF; border: none; border-radius: 14px;
      padding: 16px; font-size: 17px; font-weight: 600; cursor: pointer;
      margin-top: 10px; transition: opacity 0.2s; text-align: center; width: 100%;
    }
    button.primary:active { opacity: 0.8; }
    button.danger {
      background: #FF3B30; color: #FFFFFF; border: none; border-radius: 10px;
      padding: 8px 12px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button.secondary {
      background: #FFFFFF; color: #007AFF; border: 1px solid #007AFF;
      border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 600;
      cursor: pointer; width: 100%; margin-top: 10px; display: block; text-align: center;
    }

    /* 资产概览区 */
    .split-container { display: flex; gap: 12px; width: 88%; margin: 0 auto; margin-bottom: 20px;}
    .split-box { flex: 1; padding: 16px; border-radius: 16px; text-align: center; }
    .box-hkd { background: #F0F8FF; } 
    .box-rmb { background: #FFF8F0; } 
    .split-box h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: #666; }
    
    .asset-title { font-size: 12px; color: #8E8E93; margin-bottom: 4px; font-weight: 500;}
    .asset-val { font-size: 24px; font-weight: 800; color: #1C1C1E; letter-spacing: -0.5px; }
    .expense-val { font-size: 20px; font-weight: 700; color: #FF3B30; } 

    /* 账户/记录列表 */
    .account-list { list-style: none; padding: 0; margin: 16px 0 0 0; display: grid; gap: 1px; border-radius: 12px; overflow: hidden; width: 88%; margin-left: auto; margin-right: auto;}
    .account-list li { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; color: #333; }
    .account-list li:nth-child(odd) { background-color: #F8F9FA; }
    .account-list li:nth-child(even) { background-color: #FFFFFF; border: 1px solid #F2F2F7; border-left: none; border-right: none; }
    .account-list .acc-title { font-weight: 600; font-size: 15px; }
    .account-list .acc-bal { font-weight: 700; font-size: 16px; }
    .account-list .acc-bal.negative { color: #FF3B30; }

    .list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; width: 88%; margin: 0 auto;}
    .list li { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #F2F2F7; }
    .list li:last-child { border-bottom: none; padding-bottom: 0; }
    .list .item-title { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
    .list .meta { color: #8E8E93; font-size: 13px; }
    .list .money { font-size: 17px; font-weight: 700; text-align: right;}
    .list .money.expense { color: #1C1C1E; } 
    .list .money.income { color: #34C759; } 
    .list .money.transfer { color: #007AFF; font-size: 16px;}

    .empty { color: #8E8E93; font-size: 14px; text-align: center; margin: 20px 0 0; }

    /* 底部导航栏 */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%;
      display: flex; gap: 8px;
      background: rgba(255, 255, 255, 0.4); 
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      border-top: 1px solid rgba(255, 255, 255, 0.5);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); 
      z-index: 20;
    }
    .nav-item {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 14px 0; font-size: 15px; font-weight: 600;
      border-radius: 14px; cursor: pointer; transition: all 0.3s; color: #666;
    }
    .nav-record { background-color: rgba(0, 122, 255, 0.1); } 
    .nav-assets { background-color: rgba(52, 199, 89, 0.1); } 
    .nav-transfer { background-color: rgba(255, 149, 0, 0.1); } 

    .nav-record.active { background-color: #007AFF; color: #FFFFFF; }
    .nav-assets.active { background-color: #34C759; color: #FFFFFF; }
    .nav-transfer.active { background-color: #FF9500; color: #FFFFFF; }

    /* 账户管理界面样式 */
    .manage-section { display: grid; gap: 10px; margin-top: 15px; width: 88%; margin-left: auto; margin-right: auto;}
    .manage-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #F8F9FA; border-radius: 12px; }
    .manage-info { font-size: 15px; font-weight: 600; }
    .manage-sub { font-size: 12px; color: #8E8E93; margin-top: 2px;}

    /* 初始余额编辑器 */
    .balance-editor { display: none; margin-top: 15px; width: 88%; margin-left: auto; margin-right: auto; background: #F8F9FA; padding: 16px; border-radius: 12px;}
    .editor-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .editor-row span { font-size: 14px; font-weight: 600; }
    .editor-row input { width: 120px; padding: 10px; text-align: right; }

    /* 极简的恢复数据按钮 */
    .restore-link {
      display: block; text-align: center; margin: 30px auto 10px;
      font-size: 13px; color: #8E8E93; text-decoration: underline; cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <button class="top-btn" onclick="exportData()" data-i18n="backupBtn">备</button>
    <select id="langSelect" class="lang-select">
      <option value="zh-CN">简</option>
      <option value="zh-TW">繁</option>
      <option value="en">EN</option>
    </select>
  </header>

  <main>
    <!-- ===== 页面 1：记账 ===== -->
    <section id="page-record" class="page active">
      <section class="card">
        <h2 data-i18n="record">记账</h2>
        <form id="recordForm">
          <label><span data-i18n="amount">金额</span>
            <div class="row">
              <input type="number" id="amount" step="0.01" required placeholder="0.00">
              <select id="currency"><option value="HKD">HKD</option><option value="RMB">RMB</option></select>
            </div>
          </label>
          <label><span data-i18n="type">类型</span>
            <select id="type">
              <option value="expense" data-i18n="expense">支出</option>
              <option value="income" data-i18n="income">收入</option>
            </select>
          </label>
          <label><span data-i18n="account">账户</span>
            <select id="account"></select>
          </label>
          <label><span data-i18n="category">分类</span>
            <select id="category"></select>
          </label>
          <label><span data-i18n="date">日期</span>
            <input type="date" id="date" required>
          </label>
          <label><span data-i18n="note">备注</span>
            <input type="text" id="note" data-i18n-placeholder="notePlaceholder" placeholder="可选">
          </label>
          <button type="submit" class="primary" data-i18n="saveRecord">保存账单</button>
        </form>
      </section>

      <section class="card">
        <h2 data-i18n="billList">账单列表</h2>
        <ul id="list" class="list"></ul>
        <p id="emptyTip" class="empty" data-i18n="noRecords">还没有记录，先记一笔吧。</p>
      </section>
    </section>

    <!-- ===== 页面 2：资产概览 & 账户管理 ===== -->
    <section id="page-assets" class="page">
      <!-- 资产概览卡片 -->
      <section class="card">
        <div class="card-header">
          <h2 data-i18n="overview">资产概览</h2>
          <button class="text-btn" id="toggleAssetBtn" onclick="toggleAssets()">显示</button>
        </div>
        
        <div class="split-container">
          <div class="split-box box-hkd">
            <h3 data-i18n="hkdAccount">HKD 账户</h3>
            <div class="asset-title" data-i18n="totalAssets">总资产</div>
            <div class="asset-val" id="totalAssetsHKD">0.00</div>
            <div class="asset-title" style="margin-top: 12px;" data-i18n="monthExpense">本月支出</div>
            <div class="expense-val" id="monthSummaryHKD">0.00</div>
          </div>
          <div class="split-box box-rmb">
            <h3 data-i18n="rmbAccount">RMB 账户</h3>
            <div class="asset-title" data-i18n="totalAssets">总资产</div>
            <div class="asset-val" id="totalAssetsRMB">0.00</div>
            <div class="asset-title" style="margin-top: 12px;" data-i18n="monthExpense">本月支出</div>
            <div class="expense-val" id="monthSummaryRMB">0.00</div>
          </div>
        </div>
        <ul id="accountList" class="account-list"></ul>
      </section>

      <!-- 账户管理卡片 -->
      <section class="card">
        <h2 data-i18n="manageAccounts">自定义账户管理</h2>
        
        <!-- 添加表单 -->
        <form id="addAccountForm" style="margin-bottom: 20px;">
          <div class="row">
            <input type="text" id="newAccountName" required data-i18n-placeholder="accountNamePlaceholder" placeholder="账户名称 (如: 汇丰)">
            <select id="newAccountSubType">
              <option value="" data-i18n="none">无</option>
              <option value="存款" data-i18n="savings">存款</option>
              <option value="定期" data-i18n="fixed">定期</option>
            </select>
            <select id="newAccountCurrency" style="width: 90px;">
              <option value="HKD">HKD</option>
              <option value="RMB">RMB</option>
            </select>
          </div>
          <button type="submit" class="primary" data-i18n="addAccount">添加账户</button>
        </form>

        <!-- 已有账户列表 -->
        <div id="manageAccountList" class="manage-section"></div>
        
        <!-- 初始余额编辑器 (默认隐藏) -->
        <button class="secondary" onclick="toggleBalanceEditor()" data-i18n="adjustBalance">设置账户初始余额</button>
        <div id="balanceEditor" class="balance-editor"></div>
      </section>

      <!-- 隐藏的数据恢复入口 -->
      <div class="restore-link" onclick="toggleImport()" data-i18n="importBtn">找不到数据了？点此恢复</div>
      <div id="importArea" style="display:none; width: 88%; margin: 0 auto 20px;">
        <textarea id="importText" placeholder="请粘贴备份的代码..." style="height: 100px; margin-bottom: 10px;"></textarea>
        <button class="primary" style="background:#FF3B30;" onclick="doImport()" data-i18n="confirmImport">确认导入并覆盖</button>
      </div>
    </section>

    <!-- ===== 页面 3：转账还款 ===== -->
    <section id="page-transfer" class="page">
      <section class="card">
        <h2 data-i18n="transfer">转账 / 还款</h2>
        <form id="transferForm">
          <label><span data-i18n="from">从</span>
            <select id="fromAccount"></select>
          </label>
          <label><span data-i18n="to">到</span>
            <select id="toAccount"></select>
          </label>
          <label><span data-i18n="amount">金额</span>
            <div class="row">
              <input type="number" id="transferAmount" step="0.01" required placeholder="0.00">
              <select id="transferCurrency"><option value="HKD">HKD</option><option value="RMB">RMB</option></select>
            </div>
          </label>
          <label><span data-i18n="date">日期</span>
            <input type="date" id="transferDate" required>
          </label>
          <label><span data-i18n="note">备注</span>
            <input type="text" id="transferNote" data-i18n-placeholder="notePlaceholder" placeholder="可选">
          </label>
          <button type="submit" class="primary" data-i18n="confirmTransfer">确认转账</button>
        </form>
      </section>

      <section class="card">
        <h2 data-i18n="transferList">转账记录</h2>
        <ul id="transferList" class="list"></ul>
        <p id="transferEmptyTip" class="empty" data-i18n="noTransfers">还没有转账记录。</p>
      </section>
    </section>
  </main>

  <!-- ===== 底部导航栏 ===== -->
  <nav class="bottom-nav">
    <div class="nav-item nav-record active" onclick="switchTab('page-record', this, '#EEF4FF')">
      <span data-i18n="tabRecord">记账</span>
    </div>
    <div class="nav-item nav-assets" onclick="switchTab('page-assets', this, '#EEF8F0')">
      <span data-i18n="tabAssets">资产</span>
    </div>
    <div class="nav-item nav-transfer" onclick="switchTab('page-transfer', this, '#FFF5E9')">
      <span data-i18n="tabTransfer">转账</span>
    </div>
  </nav>

  <script>
    // ===== 多语言字典 =====
    const LANGS = {
      'zh-CN': {
        overview: '资产概览', hkdAccount: 'HKD 账户', rmbAccount: 'RMB 账户', totalAssets: '总资产', monthExpense: '本月支出',
        record: '记账', transfer: '转账 / 还款', amount: '金额', type: '类型', account: '账户', category: '分类', date: '日期', note: '备注',
        expense: '支出', income: '收入', saveRecord: '保存账单', confirmTransfer: '确认转账', from: '从', to: '到',
        billList: '账单列表', transferList: '转账记录', noRecords: '还没有记录，先记一笔吧。', noTransfers: '还没有转账记录。', notePlaceholder: '可选',
        tabRecord: '记账', tabAssets: '资产', tabTransfer: '转账',
        manageAccounts: '自定义账户管理', accountNamePlaceholder: '账户名称', none: '无', savings: '存款', fixed: '定期',
        addAccount: '添加账户', adjustBalance: '设置账户初始余额', saveBalance: '保存初始余额',
        backupBtn: '备', importBtn: '找不到数据了？点此恢复', confirmImport: '确认导入并覆盖',
        show: '显示', hide: '隐藏',
        categories: ['餐饮', '交通', '购物', '工资', '利息', '饮料', '其他']
      },
      'zh-TW': {
        overview: '資產概覽', hkdAccount: 'HKD 賬戶', rmbAccount: 'RMB 賬戶', totalAssets: '總資產', monthExpense: '本月支出',
        record: '記賬', transfer: '轉賬 / 還款', amount: '金額', type: '類型', account: '賬戶', category: '分類', date: '日期', note: '備註',
        expense: '支出', income: '收入', saveRecord: '儲存賬單', confirmTransfer: '確認轉賬', from: '從', to: '到',
        billList: '賬單列表', transferList: '轉賬記錄', noRecords: '還沒有記錄，先記一筆吧。', noTransfers: '還沒有轉賬記錄。', notePlaceholder: '可選',
        tabRecord: '記賬', tabAssets: '資產', tabTransfer: '轉賬',
        manageAccounts: '自訂賬戶管理', accountNamePlaceholder: '賬戶名稱', none: '無', savings: '存款', fixed: '定期',
        addAccount: '新增賬戶', adjustBalance: '設定賬戶初始餘額', saveBalance: '儲存初始餘額',
        backupBtn: '備', importBtn: '找不到數據了？點此恢復', confirmImport: '確認導入並覆蓋',
        show: '顯示', hide: '隱藏',
        categories: ['餐飲', '交通', '購物', '工資', '利息', '飲料', '其他']
      },
      'en': {
        overview: 'Overview', hkdAccount: 'HKD Accounts', rmbAccount: 'RMB Accounts', totalAssets: 'Total Assets', monthExpense: 'Monthly Expense',
        record: 'Record', transfer: 'Transfer / Repay', amount: 'Amount', type: 'Type', account: 'Account', category: 'Category', date: 'Date', note: 'Note',
        expense: 'Expense', income: 'Income', saveRecord: 'Save Record', confirmTransfer: 'Confirm Transfer', from: 'From', to: 'To',
        billList: 'Records', transferList: 'Transfers', noRecords: 'No records yet.', noTransfers: 'No transfers yet.', notePlaceholder: 'Optional',
        tabRecord: 'Record', tabAssets: 'Assets', tabTransfer: 'Transfer',
        manageAccounts: 'Manage Accounts', accountNamePlaceholder: 'Account Name', none: 'None', savings: 'Savings', fixed: 'Fixed',
        addAccount: 'Add Account', adjustBalance: 'Set Initial Balance', saveBalance: 'Save Balance',
        backupBtn: 'Save', importBtn: 'Lost data? Restore here', confirmImport: 'Confirm Import',
        show: 'Show', hide: 'Hide',
        categories: ['Dining', 'Transport', 'Shopping', 'Salary', 'Interest', 'Drinks', 'Others']
      }
    };

    let currentLang = localStorage.getItem('lang') || 'zh-CN';
    let assetsHidden = localStorage.getItem('assetsHidden') !== 'false';

    // 数据读写
    function loadData(key, defaultVal) { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : defaultVal; }
    function saveData(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

    let ACCOUNTS = loadData('accounts', []);

    // ===== 渲染函数 =====
    function renderManageAccounts() {
      const listEl = document.getElementById('manageAccountList');
      listEl.innerHTML = '';
      if (ACCOUNTS.length === 0) {
        listEl.innerHTML = '<div class="empty" style="margin:10px;">还没有账户，请在上方添加</div>';
        return;
      }
      ACCOUNTS.forEach(acc => {
        const div = document.createElement('div');
        div.className = 'manage-row';
        
        const info = document.createElement('div');
        const subType = acc.subType ? ` · ${LANGS[currentLang][acc.subType === '存款' ? 'savings' : 'fixed']}` : '';
        info.innerHTML = `<div class="manage-info">${acc.name}${subType}</div><div class="manage-sub">${acc.currency}</div>`;
        
        const delBtn = document.createElement('button');
        delBtn.className = 'danger';
        delBtn.textContent = '✕';
        delBtn.onclick = () => deleteAccount(acc.id);
        
        div.appendChild(info);
        div.appendChild(delBtn);
        listEl.appendChild(div);
      });
    }

    function renderAccountOptions() {
      const accountSelect = document.getElementById('account');
      const fromSelect = document.getElementById('fromAccount');
      const toSelect = document.getElementById('toAccount');
      
      accountSelect.innerHTML = ''; fromSelect.innerHTML = ''; toSelect.innerHTML = '';
      
      if (ACCOUNTS.length === 0) {
        const opt = document.createElement('option');
        opt.textContent = '请先在【资产】页底部添加账户';
        accountSelect.appendChild(opt); fromSelect.appendChild(opt); toSelect.appendChild(opt);
        return;
      }

      ACCOUNTS.forEach((acc) => {
        const subType = acc.subType ? ` · ${acc.subType}` : '';
        const text = `${acc.name}${subType}（${acc.currency}）`;
        
        const opt1 = document.createElement('option'); opt1.value = acc.id; opt1.textContent = text; accountSelect.appendChild(opt1);
        const opt2 = document.createElement('option'); opt2.value = acc.id; opt2.textContent = text; fromSelect.appendChild(opt2);
        const opt3 = document.createElement('option'); opt3.value = acc.id; opt3.textContent = text; toSelect.appendChild(opt3);
      });
    }

    function renderCategoryOptions() {
      const select = document.getElementById('category');
      select.innerHTML = '';
      LANGS[currentLang].categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat; opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    function calcBalance(accountId) {
      const records = loadData('records', []);
      const transfers = loadData('transfers', []);
      const initial = loadData('initialBalances', {})[accountId] || 0;
      
      const recordDelta = records.filter((r) => r.accountId === accountId).reduce((sum, r) => sum + (r.type === 'income' ? r.amount : -r.amount), 0);
      const transferDelta = transfers.reduce((sum, t) => {
        if (t.from === accountId) return sum - t.amount;
        if (t.to === accountId) return sum + t.amount;
        return sum;
      }, 0);
      return initial + recordDelta + transferDelta;
    }

    function renderAccounts() {
      const listEl = document.getElementById('accountList'); 
      listEl.innerHTML = '';
      ACCOUNTS.forEach((acc) => {
        const balance = calcBalance(acc.id);
        const li = document.createElement('li');
        const subType = acc.subType ? ` · ${acc.subType}` : '';
        const balDisplay = assetsHidden ? '****' : balance.toFixed(2);
        const negClass = (!assetsHidden && balance < 0) ? 'negative' : '';
        li.innerHTML = `<div class="acc-title">${acc.name}${subType}</div><div class="acc-bal ${negClass}">${acc.currency} ${balDisplay}</div>`;
        listEl.appendChild(li);
      });
    }

    function renderList() {
      const records = loadData('records', []);
      const listEl = document.getElementById('list'); const emptyTip = document.getElementById('emptyTip');
      listEl.innerHTML = '';
      const sorted = [...records].sort((a, b) => a.date === b.date ? b.createdAt - a.createdAt : (a.date < b.date ? 1 : -1));
      sorted.forEach((r) => {
        const li = document.createElement('li');
        const metaName = r.accountName || '未知账户';
        li.innerHTML = `
          <div>
            <div class="item-title">${r.category}${r.note ? ' · ' + r.note : ''}</div>
            <div class="meta">${r.date} · ${metaName}</div>
          </div>
          <div class="money ${r.type}">${(r.type === 'expense' ? '-' : '+') + r.amount.toFixed(2) + ' ' + r.currency}</div>
        `;
        listEl.appendChild(li);
      });
      emptyTip.style.display = records.length ? 'none' : 'block';
    }

    function renderTransfers() {
      const transfers = loadData('transfers', []);
      const listEl = document.getElementById('transferList'); const emptyTip = document.getElementById('transferEmptyTip');
      listEl.innerHTML = '';
      const sorted = [...transfers].sort((a, b) => b.createdAt - a.createdAt);
      sorted.forEach((t) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <div>
            <div class="item-title">${t.fromName} → ${t.toName}</div>
            <div class="meta">${t.date}${t.note ? ' · ' + t.note : ''}</div>
          </div>
          <div class="money transfer">${t.amount.toFixed(2)} ${t.currency}</div>
        `;
        listEl.appendChild(li);
      });
      emptyTip.style.display = transfers.length ? 'none' : 'block';
    }

    function renderTotalAssets() {
      let totalHKD = 0; let totalRMB = 0;
      ACCOUNTS.forEach((acc) => {
        const balance = calcBalance(acc.id);
        if (acc.currency === 'HKD') totalHKD += balance;
        if (acc.currency === 'RMB') totalRMB += balance;
      });
      document.getElementById('totalAssetsHKD').textContent = assetsHidden ? '****' : totalHKD.toFixed(2);
      document.getElementById('totalAssetsRMB').textContent = assetsHidden ? '****' : totalRMB.toFixed(2);
    }

    function renderSummary() {
      const records = loadData('records', []);
      const monthExpense = (currency) => records.filter((r) => r.type === 'expense' && r.currency === currency && isThisMonth(r.date)).reduce((sum, r) => sum + r.amount, 0);
      document.getElementById('monthSummaryHKD').textContent = monthExpense('HKD').toFixed(2);
      document.getElementById('monthSummaryRMB').textContent = monthExpense('RMB').toFixed(2);
    }

    function renderAll() { 
      renderAccounts(); 
      renderList(); 
      renderSummary(); 
      renderTransfers(); 
      renderTotalAssets();
      renderManageAccounts();
      updateEyeBtn();
    }

    // 工具
    function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function isThisMonth(dateStr) { const now = new Date(); return dateStr.startsWith(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`); }

    // ===== 资产隐藏切换逻辑 =====
    function updateEyeBtn() {
      const btn = document.getElementById('toggleAssetBtn');
      if (btn) btn.textContent = assetsHidden ? LANGS[currentLang].show : LANGS[currentLang].hide;
    }

    function toggleAssets() {
      assetsHidden = !assetsHidden;
      localStorage.setItem('assetsHidden', !assetsHidden);
      renderAccounts();
      renderTotalAssets();
      updateEyeBtn();
    }

    // ===== 账户操作 & 初始余额 =====
    function deleteAccount(id) {
      if (!confirm('删除账户后，相关历史账单仍保留，但无法再对其进行记账。确定删除？')) return;
      ACCOUNTS = ACCOUNTS.filter(a => a.id !== id);
      saveData('accounts', ACCOUNTS);
      renderAll();
      renderAccountOptions();
    }
