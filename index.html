<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的账本</title>
  <style>
    /* 全局基础设置 */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: #EEF4FF; 
      color: #1C1C1E;
      font-size: 16px;
      line-height: 1.4;
      padding-bottom: 90px; 
      transition: background-color 0.4s ease;
    }
    
    /* 顶部区域 */
    .topbar {
      position: absolute;
      top: 0; left: 0; width: 100%;
      padding: 15px 20px; 
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
      z-index: 100;
    }
    
    .top-btn, .lang-select {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(0,0,0,0.05);
      border-radius: 8px;
      color: #007AFF;
      font-size: 14px; font-weight: 600;
      height: 32px; 
      outline: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
      pointer-events: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .top-btn {
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .top-btn:active { opacity: 0.7; }

    .lang-select {
      width: 60px; 
      text-align: center;
      text-align-last: center; 
      padding: 0;
      -webkit-appearance: none;
    }

    /* 主容器 */
    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 65px 16px 20px; 
    }
    
    .page { display: none; }
    .page.active { display: block; animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* 纯白卡片 */
    .card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 24px 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04); 
    }
    
    /* 带隐藏按钮的标题 */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .card-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #1C1C1E;
    }
    
    /* 极简文字按钮 */
    .text-btn {
      background: transparent;
      border: 1px solid #007AFF;
      color: #007AFF;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .text-btn:active { background: #F0F8FF; }

    .card h2 { margin: 0 0 20px; font-size: 18px; font-weight: 700; color: #1C1C1E; }

    /* 表单元素 */
    form { display: grid; gap: 16px; width: 88%; margin: 0 auto; }
    label {
      display: grid; gap: 6px; font-size: 13px; font-weight: 600;
      color: #8E8E93; text-transform: uppercase; letter-spacing: 0.5px; text-align: left; 
    }
    input, select, textarea {
      font: inherit; font-size: 16px; padding: 14px 16px;
      border: none; border-radius: 12px; background: #F2F2F7; 
      color: #1C1C1E; outline: none; transition: box-shadow 0.2s;
      -webkit-appearance: none; text-align: left; width: 100%; 
    }
    input[type="date"] { display: flex; align-items: center; justify-content: flex-start; text-align: left !important; -webkit-appearance: none; }
    input[type="date"]::-webkit-date-and-time-value { text-align: left !important; width: 100%; }
    input[type="date"]::-webkit-datetime-edit { text-align: left !important; width: 100%; }
    input[type="date"]::-webkit-calendar-picker-indicator { position: absolute; right: 16px; height: 100%; width: 30px; opacity: 0; }

    input:focus, select:focus, textarea:focus { box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2); background: #FFFFFF; }

    /* 币种跟随账户自动锁定时的样式 */
    select:disabled {
      opacity: 0.7;
      background: #E9E9EE;
      color: #1C1C1E;
      -webkit-text-fill-color: #1C1C1E;
      cursor: not-allowed;
    }
    
    .row { display: flex; gap: 10px; width: 100%; }
    .row input { flex: 1; }
    .row select { width: 100px; text-align: center; flex-shrink: 0; } 
    
    /* 按钮 */
    button.primary {
      background: #007AFF; color: #FFFFFF; border: none; border-radius: 14px;
      padding: 16px; font-size: 17px; font-weight: 600; cursor: pointer;
      margin-top: 10px; transition: opacity 0.2s; text-align: center; width: 100%;
    }
    button.primary:active { opacity: 0.8; }
    button.danger {
      background: #FF3B30; color: #FFFFFF; border: none; border-radius: 10px;
      padding: 8px 12px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button.danger:active { opacity: 0.8; }
    button.secondary {
      background: #FFFFFF; color: #007AFF; border: 1px solid #007AFF;
      border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 600;
      cursor: pointer; width: 100%; margin-top: 10px; display: block; text-align: center;
    }
    button.secondary:active { background: #F0F8FF; }

    /* 资产概览区 */
    .split-container { display: flex; gap: 12px; width: 88%; margin: 0 auto; margin-bottom: 20px;}
    .split-box { flex: 1; padding: 16px; border-radius: 16px; text-align: center; }
    .box-hkd { background: #F0F8FF; } 
    .box-rmb { background: #FFF8F0; } 
    .split-box h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: #666; }
    
    .asset-title { font-size: 12px; color: #8E8E93; margin-bottom: 4px; font-weight: 500;}
    .asset-val { font-size: 24px; font-weight: 800; color: #1C1C1E; letter-spacing: -0.5px; }
    .expense-val { font-size: 20px; font-weight: 700; color: #FF3B30; } 

    /* ===== 明细查询 ===== */
    .query-area { width: 88%; margin: 0 auto; display: grid; gap: 14px; }
    .query-field { display: grid; gap: 8px; }
    .query-label { font-size: 13px; font-weight: 600; color: #8E8E93; text-transform: uppercase; letter-spacing: 0.5px; }
    .quick-range { display: flex; gap: 8px; flex-wrap: wrap; }
    .range-btn {
      flex: 1; min-width: 56px; padding: 10px 4px;
      background: #F2F2F7; border: none; border-radius: 10px;
      font-size: 13px; font-weight: 600; color: #666; cursor: pointer;
      transition: all 0.2s;
    }
    .range-btn.active { background: #007AFF; color: #FFFFFF; }
    .range-btn:active { opacity: 0.8; }
    .custom-range { display: flex; gap: 8px; align-items: center; }
    .custom-range input { flex: 1; padding: 12px; min-width: 0; }
    .custom-range span { font-size: 13px; color: #8E8E93; flex-shrink: 0; }

    .query-result { margin-top: 18px; }
    .query-summary { width: 88%; margin: 0 auto 16px; display: grid; gap: 10px; }
    .currency-summary { background: #F8F9FA; border-radius: 12px; padding: 12px 14px; }
    .cs-header { font-size: 14px; font-weight: 700; color: #1C1C1E; margin-bottom: 8px; }
    .cs-row { display: flex; gap: 14px; font-size: 13px; color: #8E8E93; flex-wrap: wrap; }
    .cs-row b { font-weight: 700; font-size: 14px; }
    .cs-row b.income { color: #34C759; }
    .cs-row b.expense { color: #FF3B30; }
    .cs-row b.net { color: #1C1C1E; }
    .cs-row b.net.negative { color: #FF3B30; }

    /* 账户/记录列表 */
    .account-list { list-style: none; padding: 0; margin: 16px 0 0 0; display: grid; gap: 1px; border-radius: 12px; overflow: hidden; width: 88%; margin-left: auto; margin-right: auto;}
    .account-list li { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; color: #333; }
    .account-list li:nth-child(odd) { background-color: #F8F9FA; }
    .account-list li:nth-child(even) { background-color: #FFFFFF; border: 1px solid #F2F2F7; border-left: none; border-right: none; }
    .account-list .acc-title { font-weight: 600; font-size: 15px; }
    .account-list .acc-bal { font-weight: 700; font-size: 16px; }
    .account-list .acc-bal.negative { color: #FF3B30; }

    .list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; width: 88%; margin: 0 auto;}
    .list li { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 6px 4px; margin: -6px -8px -6px -4px; border-radius: 10px; border-bottom: 1px solid #F2F2F7; cursor: pointer; transition: background 0.15s; }
    .list li:last-child { border-bottom: none; }
    .list li:active { background: #F2F2F7; }
    /* 查询结果的记录为只读，不显示点击反馈 */
    .list li.no-click { cursor: default; }
    .list li.no-click:active { background: transparent; }
    .list .item-title { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
    .list .meta { color: #8E8E93; font-size: 13px; }
    .list .money { font-size: 17px; font-weight: 700; text-align: right;}
    .list .money.expense { color: #1C1C1E; } 
    .list .money.income { color: #34C759; } 
    .list .money.transfer { color: #007AFF; font-size: 16px;}

    .empty { color: #8E8E93; font-size: 14px; text-align: center; margin: 20px 0 0; }

    /* 底部导航栏 */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%;
      display: flex; gap: 8px;
      background: rgba(255, 255, 255, 0.4); 
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      border-top: 1px solid rgba(255, 255, 255, 0.5);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); 
      z-index: 20;
    }
    .nav-item {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 14px 0; font-size: 15px; font-weight: 600;
      border-radius: 14px; cursor: pointer; transition: all 0.3s; color: #666;
    }
    .nav-record { background-color: rgba(0, 122, 255, 0.1); } 
    .nav-assets { background-color: rgba(52, 199, 89, 0.1); } 
    .nav-transfer { background-color: rgba(255, 149, 0, 0.1); } 

    .nav-record.active { background-color: #007AFF; color: #FFFFFF; }
    .nav-assets.active { background-color: #34C759; color: #FFFFFF; }
    .nav-transfer.active { background-color: #FF9500; color: #FFFFFF; }

    /* 账户管理界面样式 */
    .manage-section { display: grid; gap: 10px; margin-top: 15px; width: 88%; margin-left: auto; margin-right: auto;}
    .manage-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #F8F9FA; border-radius: 12px; }
    .manage-info { font-size: 15px; font-weight: 600; }
    .manage-sub { font-size: 12px; color: #8E8E93; margin-top: 2px;}

    /* 初始余额编辑器 */
    .balance-editor { display: none; margin-top: 15px; width: 88%; margin-left: auto; margin-right: auto; background: #F8F9FA; padding: 16px; border-radius: 12px;}
    .editor-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .editor-row span { font-size: 14px; font-weight: 600; }
    .editor-row input { width: 120px; padding: 10px; text-align: right; }

    /* 极简的恢复数据按钮 */
    .restore-link {
      display: block; text-align: center; margin: 30px auto 10px;
      font-size: 13px; color: #8E8E93; text-decoration: underline; cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <button class="top-btn" onclick="exportData()" data-i18n="backupBtn">备</button>
    <select id="langSelect" class="lang-select">
      <option value="zh-CN">简</option>
      <option value="zh-TW">繁</option>
      <option value="en">EN</option>
    </select>
  </header>

  <main>
    <!-- ===== 页面 1：记账 ===== -->
    <section id="page-record" class="page active">
      <section class="card">
        <h2 id="recordFormTitle" data-i18n="record">记账</h2>
        <form id="recordForm">
          <label><span data-i18n="amount">金额</span>
            <div class="row">
              <input type="number" id="amount" step="0.01" required placeholder="0.00">
              <select id="currency"><option value="HKD">HKD</option><option value="RMB">RMB</option></select>
            </div>
          </label>
          <label><span data-i18n="type">类型</span>
            <select id="type">
              <option value="expense" data-i18n="expense">支出</option>
              <option value="income" data-i18n="income">收入</option>
            </select>
          </label>
          <label><span data-i18n="account">账户</span>
            <select id="account"></select>
          </label>
          <label><span data-i18n="category">分类</span>
            <select id="category"></select>
          </label>
          <label><span data-i18n="date">日期</span>
            <input type="date" id="date" required>
          </label>
          <label><span data-i18n="note">备注</span>
            <input type="text" id="note" data-i18n-placeholder="notePlaceholder" placeholder="可选">
          </label>
          <button type="submit" class="primary" id="recordSubmitBtn" data-i18n="saveRecord">保存账单</button>
          <button type="button" class="secondary" id="cancelEditBtn" onclick="cancelEdit()" style="display:none;">取消编辑</button>
          <button type="button" class="danger" id="deleteEditBtn" onclick="deleteEditingRecord()" style="display:none; width:100%; padding:14px; font-size:15px;">删除这条账单</button>
        </form>
      </section>

      <section class="card">
        <h2 data-i18n="billList">账单列表</h2>
        <ul id="list" class="list"></ul>
        <p id="emptyTip" class="empty" data-i18n="noRecords">还没有记录，先记一笔吧。</p>
      </section>
    </section>

    <!-- ===== 页面 2：资产概览 & 账户管理 ===== -->
    <section id="page-assets" class="page">
      <!-- 资产概览卡片 -->
      <section class="card">
        <div class="card-header">
          <h2 data-i18n="overview">资产概览</h2>
          <button class="text-btn" id="toggleAssetBtn" onclick="toggleAssets()">显示</button>
        </div>
        
        <div class="split-container">
          <div class="split-box box-hkd">
            <h3 data-i18n="hkdAccount">HKD 账户</h3>
            <div class="asset-title" data-i18n="totalAssets">总资产</div>
            <div class="asset-val" id="totalAssetsHKD">0.00</div>
            <div class="asset-title" style="margin-top: 12px;" data-i18n="monthExpense">本月支出</div>
            <div class="expense-val" id="monthSummaryHKD">0.00</div>
          </div>
          <div class="split-box box-rmb">
            <h3 data-i18n="rmbAccount">RMB 账户</h3>
            <div class="asset-title" data-i18n="totalAssets">总资产</div>
            <div class="asset-val" id="totalAssetsRMB">0.00</div>
            <div class="asset-title" style="margin-top: 12px;" data-i18n="monthExpense">本月支出</div>
            <div class="expense-val" id="monthSummaryRMB">0.00</div>
          </div>
        </div>
        <ul id="accountList" class="account-list"></ul>
      </section>

      <!-- ===== 明细查询卡片 ===== -->
      <section class="card">
        <h2 data-i18n="queryTitle">明细查询</h2>
        <div class="query-area">
          <div class="query-field">
            <div class="query-label" data-i18n="account">账户</div>
            <select id="queryAccount"></select>
          </div>

          <div class="query-field">
            <div class="query-label" data-i18n="timeRange">时间范围</div>
            <div class="quick-range">
              <button type="button" class="range-btn active" data-range="thisMonth" onclick="setRange('thisMonth')" data-i18n="thisMonth">本月</button>
              <button type="button" class="range-btn" data-range="lastMonth" onclick="setRange('lastMonth')" data-i18n="lastMonth">上月</button>
              <button type="button" class="range-btn" data-range="last30" onclick="setRange('last30')" data-i18n="last30">近30天</button>
              <button type="button" class="range-btn" data-range="all" onclick="setRange('all')" data-i18n="allTime">全部</button>
              <button type="button" class="range-btn" data-range="custom" onclick="setRange('custom')" data-i18n="customRange">自定义</button>
            </div>
          </div>

          <div id="customRange" class="custom-range" style="display:none;">
            <input type="date" id="queryStart">
            <span data-i18n="toLabel">至</span>
            <input type="date" id="queryEnd">
          </div>

          <button type="button" class="primary" style="margin-top:0;" onclick="runQuery()" data-i18n="queryBtn">查询</button>
        </div>

        <div id="queryResult" class="query-result"></div>
      </section>

      <!-- 账户管理卡片 -->
      <section class="card">
        <h2 data-i18n="manageAccounts">自定义账户管理</h2>
        
        <!-- 添加表单 -->
        <form id="addAccountForm" style="margin-bottom: 20px;">
          <div class="row">
            <input type="text" id="newAccountName" required data-i18n-placeholder="accountNamePlaceholder" placeholder="账户名称 (如: 汇丰)">
            <select id="newAccountSubType">
              <option value="" data-i18n="none">无</option>
              <option value="存款" data-i18n="savings">存款</option>
              <option value="定期" data-i18n="fixed">定期</option>
            </select>
            <select id="newAccountCurrency" style="width: 90px;">
              <option value="HKD">HKD</option>
              <option value="RMB">RMB</option>
            </select>
          </div>
          <button type="submit" class="primary" data-i18n="addAccount">添加账户</button>
        </form>

        <!-- 已有账户列表 -->
        <div id="manageAccountList" class="manage-section"></div>
        
        <!-- 初始余额编辑器 (默认隐藏) -->
        <button class="secondary" onclick="toggleBalanceEditor()" data-i18n="adjustBalance">设置账户初始余额</button>
        <div id="balanceEditor" class="balance-editor"></div>
      </section>

      <!-- 隐藏的数据恢复入口 -->
      <div class="restore-link" onclick="toggleImport()" data-i18n="importBtn">找不到数据了？点此恢复</div>
      <div id="importArea" style="display:none; width: 88%; margin: 0 auto 20px;">
        <textarea id="importText" placeholder="请粘贴备份的代码..." style="height: 100px; margin-bottom: 10px;"></textarea>
        <button class="primary" style="background:#FF3B30;" onclick="doImport()" data-i18n="confirmImport">确认导入并覆盖</button>
      </div>
    </section>

    <!-- ===== 页面 3：转账还款 ===== -->
    <section id="page-transfer" class="page">
      <section class="card">
        <h2 data-i18n="transfer">转账 / 还款</h2>
        <form id="transferForm">
          <label><span data-i18n="from">从</span>
            <select id="fromAccount"></select>
          </label>
          <label><span data-i18n="to">到</span>
            <select id="toAccount"></select>
          </label>
          <label><span data-i18n="amount">金额</span>
            <div class="row">
              <input type="number" id="transferAmount" step="0.01" required placeholder="0.00">
              <select id="transferCurrency"><option value="HKD">HKD</option><option value="RMB">RMB</option></select>
            </div>
          </label>
          <label><span data-i18n="date">日期</span>
            <input type="date" id="transferDate" required>
          </label>
          <label><span data-i18n="note">备注</span>
            <input type="text" id="transferNote" data-i18n-placeholder="notePlaceholder" placeholder="可选">
          </label>
          <button type="submit" class="primary" data-i18n="confirmTransfer">确认转账</button>
        </form>
      </section>

      <section class="card">
        <h2 data-i18n="transferList">转账记录</h2>
        <ul id="transferList" class="list"></ul>
        <p id="transferEmptyTip" class="empty" data-i18n="noTransfers">还没有转账记录。</p>
      </section>
    </section>
  </main>

  <!-- ===== 底部导航栏 ===== -->
  <nav class="bottom-nav">
    <div class="nav-item nav-record active" onclick="switchTab('page-record', this, '#EEF4FF')">
      <span data-i18n="tabRecord">记账</span>
    </div>
    <div class="nav-item nav-assets" onclick="switchTab('page-assets', this, '#EEF8F0')">
      <span data-i18n="tabAssets">资产</span>
    </div>
    <div class="nav-item nav-transfer" onclick="switchTab('page-transfer', this, '#FFF5E9')">
      <span data-i18n="tabTransfer">转账</span>
    </div>
  </nav>

  <script>
    // ===== 多语言字典 =====
    const LANGS = {
      'zh-CN': {
        overview: '资产概览', hkdAccount: 'HKD 账户', rmbAccount: 'RMB 账户', totalAssets: '总资产', monthExpense: '本月支出',
        record: '记账', transfer: '转账 / 还款', amount: '金额', type: '类型', account: '账户', category: '分类', date: '日期', note: '备注',
        expense: '支出', income: '收入', saveRecord: '保存账单', confirmTransfer: '确认转账', from: '从', to: '到',
        billList: '账单列表', transferList: '转账记录', noRecords: '还没有记录，先记一笔吧。', noTransfers: '还没有转账记录。', notePlaceholder: '可选',
        tabRecord: '记账', tabAssets: '资产', tabTransfer: '转账',
        manageAccounts: '自定义账户管理', accountNamePlaceholder: '账户名称', none: '无', savings: '存款', fixed: '定期',
        addAccount: '添加账户', adjustBalance: '设置账户初始余额', saveBalance: '保存初始余额',
        backupBtn: '备', importBtn: '找不到数据了？点此恢复', confirmImport: '确认导入并覆盖',

    function calcBalance(accountId) {
      const records = loadData('records', []);
      const transfers = loadData('transfers', []);
      const initial = loadData('initialBalances', {})[accountId] || 0;
      
      const recordDelta = records.filter((r) => r.accountId === accountId).reduce((sum, r) => sum + (r.type === 'income' ? r.amount : -r.amount), 0);
      const transferDelta = transfers.reduce((sum, t) => {
        if (t.from === accountId) return sum - t.amount;
        if (t.to === accountId) return sum + t.amount;
        return sum;
      }, 0);
      return initial + recordDelta + transferDelta;
    }

    function renderAccounts() {
      const listEl = document.getElementById('accountList'); 
      listEl.innerHTML = '';
      ACCOUNTS.forEach((acc) => {
        const balance = calcBalance(acc.id);
        const li = document.createElement('li');
        const subType = acc.subType ? ` · ${acc.subType}` : '';
        const balDisplay = assetsHidden ? '****' : balance.toFixed(2);
        const negClass = (!assetsHidden && balance < 0) ? 'negative' : '';
        li.innerHTML = `<div class="acc-title">${acc.name}${subType}</div><div class="acc-bal ${negClass}">${acc.currency} ${balDisplay}</div>`;
        listEl.appendChild(li);
      });
    }

    function renderList() {
      const records = loadData('records', []);
      const listEl = document.getElementById('list'); const emptyTip = document.getElementById('emptyTip');
      listEl.innerHTML = '';
      const sorted = [...records].sort((a, b) => a.date === b.date ? b.createdAt - a.createdAt : (a.date < b.date ? 1 : -1));
      sorted.forEach((r) => {
        const li = document.createElement('li');
        const metaName = r.accountName || '未知账户';
        li.innerHTML = `
          <div>
            <div class="item-title">${r.category}${r.note ? ' · ' + r.note : ''}</div>
            <div class="meta">${r.date} · ${metaName}</div>
          </div>
          <div class="money ${r.type}">${(r.type === 'expense' ? '-' : '+') + r.amount.toFixed(2) + ' ' + r.currency}</div>
        `;
        li.onclick = () => editRecord(r.id);
        listEl.appendChild(li);
      });
      emptyTip.style.display = records.length ? 'none' : 'block';
    }

    function renderTransfers() {
      const transfers = loadData('transfers', []);
      const listEl = document.getElementById('transferList'); const emptyTip = document.getElementById('transferEmptyTip');
      listEl.innerHTML = '';
      const sorted = [...transfers].sort((a, b) => b.createdAt - a.createdAt);
      sorted.forEach((t) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <div>
            <div class="item-title">${t.fromName} → ${t.toName}</div>
            <div class="meta">${t.date}${t.note ? ' · ' + t.note : ''}</div>
          </div>
          <div class="money transfer">${t.amount.toFixed(2)} ${t.currency}</div>
        `;
        listEl.appendChild(li);
      });
      emptyTip.style.display = transfers.length ? 'none' : 'block';
    }

    function renderTotalAssets() {
      let totalHKD = 0; let totalRMB = 0;
      ACCOUNTS.forEach((acc) => {
        const balance = calcBalance(acc.id);
        if (acc.currency === 'HKD') totalHKD += balance;
        if (acc.currency === 'RMB') totalRMB += balance;
      });
      document.getElementById('totalAssetsHKD').textContent = assetsHidden ? '****' : totalHKD.toFixed(2);
      document.getElementById('totalAssetsRMB').textContent = assetsHidden ? '****' : totalRMB.toFixed(2);
    }

    function renderSummary() {
      const records = loadData('records', []);
      const monthExpense = (currency) => records.filter((r) => r.type === 'expense' && r.currency === currency && isThisMonth(r.date)).reduce((sum, r) => sum + r.amount, 0);
      document.getElementById('monthSummaryHKD').textContent = monthExpense('HKD').toFixed(2);
      document.getElementById('monthSummaryRMB').textContent = monthExpense('RMB').toFixed(2);
    }

    function renderAll() { 
      renderAccounts(); 
      renderList(); 
      renderSummary(); 
      renderTransfers(); 
      renderTotalAssets();
      renderManageAccounts();
      updateEyeBtn();
      refreshQuery(); // 数据变化后同步刷新查询结果
    }

    // 工具
    function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function isThisMonth(dateStr) { const now = new Date(); return dateStr.startsWith(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`); }
    function pad2(n) { return String(n).padStart(2, '0'); }
    function fmtDate(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

    // ===== 资产隐藏切换逻辑 =====
    function updateEyeBtn() {
      const btn = document.getElementById('toggleAssetBtn');
      if (btn) btn.textContent = assetsHidden ? LANGS[currentLang].show : LANGS[currentLang].hide;
    }

    function toggleAssets() {
      assetsHidden = !assetsHidden;
      localStorage.setItem('assetsHidden', !assetsHidden);
      renderAccounts();
      renderTotalAssets();
      updateEyeBtn();
    }

    // ===== 币种联动 =====
    function syncRecordCurrency() {
      const acc = ACCOUNTS.find(a => a.id === document.getElementById('account').value);
      const sel = document.getElementById('currency');
      if (acc) {
        sel.value = acc.currency;
        sel.disabled = true; // 账户币种固定，禁止手动改
      } else {
        sel.disabled = false;
      }
    }

    function filterToAccounts() {
      const fromId = document.getElementById('fromAccount').value;
      const fromAcc = ACCOUNTS.find(a => a.id === fromId);
      const toSel = document.getElementById('toAccount');
      const prev = toSel.value;
      toSel.innerHTML = '';
      ACCOUNTS.forEach(acc => {
        if (acc.id === fromId) return;
        if (fromAcc && acc.currency !== fromAcc.currency) return; // 只保留同币种
        const opt = document.createElement('option');
        opt.value = acc.id;
        opt.textContent = `${acc.name}${acc.subType ? ' · ' + acc.subType : ''}（${acc.currency}）`;
        toSel.appendChild(opt);
      });
      if ([...toSel.options].some(o => o.value === prev)) toSel.value = prev;
    }

    function syncTransferCurrency() {
      const fromAcc = ACCOUNTS.find(a => a.id === document.getElementById('fromAccount').value);
      const sel = document.getElementById('transferCurrency');
      if (fromAcc) {
        sel.value = fromAcc.currency;
        sel.disabled = true;
      } else {
        sel.disabled = false;
      }
      filterToAccounts();
    }

    // ===== 明细查询 =====
    function getRangeDates(range) {
      const now = new Date();
      const y = now.getFullYear(), m = now.getMonth();
      if (range === 'thisMonth') {
        return {
          start: `${y}-${pad2(m+1)}-01`,
          end: `${y}-${pad2(m+1)}-${pad2(new Date(y, m+1, 0).getDate())}`
        };
      }
      if (range === 'lastMonth') {
        const lm = new Date(y, m-1, 1);
        const ly = lm.getFullYear(), lmm = lm.getMonth();
        return {
          start: `${ly}-${pad2(lmm+1)}-01`,
          end: `${ly}-${pad2(lmm+1)}-${pad2(new Date(ly, lmm+1, 0).getDate())}`
        };
      }
      if (range === 'last30') {
        const s = new Date(now);
        s.setDate(s.getDate() - 29);
        return { start: fmtDate(s), end: fmtDate(now) };
      }
      return { start: '', end: '' }; // all
    }

    function setRange(range) {
      currentRange = range;
      document.querySelectorAll('.range-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.range === range);
      });
      const customEl = document.getElementById('customRange');
      if (range === 'custom') {
        customEl.style.display = 'flex';
        if (!document.getElementById('queryStart').value) {
          const r = getRangeDates('thisMonth');
          document.getElementById('queryStart').value = r.start;
          document.getElementById('queryEnd').value = r.end;
        }
      } else {
        customEl.style.display = 'none';
      }
    }

    function runQuery() {
      const L = LANGS[currentLang];
      const container = document.getElementById('queryResult');
      const accVal = document.getElementById('queryAccount').value || 'all';

      let start = '', end = '';
      if (currentRange === 'custom') {
        start = document.getElementById('queryStart').value;
        end = document.getElementById('queryEnd').value;
        if (!start || !end) { alert(L.needRange); return; }
        if (start > end) { alert(L.invalidRange); return; }
      } else {
        const r = getRangeDates(currentRange);
        start = r.start; end = r.end;
      }

      const records = loadData('records', []);
      const filtered = records.filter(r => {
        if (accVal !== 'all' && r.accountId !== accVal) return false;
        if (start && r.date < start) return false;
        if (end && r.date > end) return false;
        return true;
      }).sort((a, b) => a.date === b.date ? b.createdAt - a.createdAt : (a.date < b.date ? 1 : -1));

      container.dataset.hasResult = '1';

      if (!filtered.length) {
        container.innerHTML = `<p class="empty">${L.queryNoResult}</p>`;
        return;
      }

      // 按币种分别汇总（不同币种不能直接相加）
      const byCur = {};
      filtered.forEach(r => {
        if (!byCur[r.currency]) byCur[r.currency] = { income: 0, expense: 0, count: 0 };
        byCur[r.currency].count++;
        if (r.type === 'income') byCur[r.currency].income += r.amount;
        else byCur[r.currency].expense += r.amount;
      });

      let summaryHtml = '<div class="query-summary">';
      Object.keys(byCur).sort().forEach(cur => {
        const s = byCur[cur];
        const net = s.income - s.expense;
        summaryHtml += `
          <div class="currency-summary">
            <div class="cs-header">${cur} · ${s.count} ${L.queryCount}</div>
            <div class="cs-row">
              <span>${L.queryIncome} <b class="income">+${s.income.toFixed(2)}</b></span>
              <span>${L.queryExpense} <b class="expense">-${s.expense.toFixed(2)}</b></span>
              <span>${L.queryNet} <b class="net ${net < 0 ? 'negative' : ''}">${net >= 0 ? '+' : ''}${net.toFixed(2)}</b></span>
            </div>
          </div>
        `;
      });
      summaryHtml += '</div>';

      // 明细列表（只读，不可点击编辑）
      let listHtml = '<ul class="list">';
      filtered.forEach(r => {
        listHtml += `
          <li class="no-click">
            <div>
              <div class="item-title">${r.category}${r.note ? ' · ' + r.note : ''}</div>
              <div class="meta">${r.date} · ${r.accountName || '未知账户'}</div>
            </div>
            <div class="money ${r.type}">${(r.type === 'expense' ? '-' : '+') + r.amount.toFixed(2) + ' ' + r.currency}</div>
          </li>
        `;
      });
      listHtml += '</ul>';

      container.innerHTML = summaryHtml + listHtml;
    }

    // 数据变化后，如果已经有查询结果则自动刷新
    function refreshQuery() {
      const container = document.getElementById('queryResult');
      if (container && container.dataset.hasResult === '1') runQuery();
    }

    function updateRecordFormUI() {
      const L = LANGS[currentLang];
      const titleEl = document.getElementById('recordFormTitle');
      const submitEl = document.getElementById('recordSubmitBtn');
      const cancelEl = document.getElementById('cancelEditBtn');
      const delEl = document.getElementById('deleteEditBtn');
      if (editingId) {
        titleEl.textContent = L.editBill;
        submitEl.textContent = L.saveEdit;
        cancelEl.textContent = L.cancelEdit;
        delEl.textContent = L.deleteBill;
        cancelEl.style.display = 'block';
        delEl.style.display = 'block';
      } else {
        titleEl.textContent = L.record;
        submitEl.textContent = L.saveRecord;
        cancelEl.style.display = 'none';
        delEl.style.display = 'none';
      }
    }

    function editRecord(id) {
      const records = loadData('records', []);
      const r = records.find(x => x.id === id);
      if (!r) return;

      editingId = id;

      // 如果原账户已被删除，补一个临时选项以免填不进去
      const accountSel = document.getElementById('account');
      if (!ACCOUNTS.some(a => a.id === r.accountId)) {
        const opt = document.createElement('option');
        opt.value = r.accountId;
        opt.textContent = (r.accountName || '未知账户') + '（已删除）';
        accountSel.appendChild(opt);
      }
      accountSel.value = r.accountId;

      document.getElementById('amount').value = r.amount;
      document.getElementById('type').value = r.type;
      document.getElementById('category').value = r.category;
      document.getElementById('date').value = r.date;
      document.getElementById('note').value = r.note || '';

      syncRecordCurrency();
      updateRecordFormUI();

      document.getElementById('recordFormTitle').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('recordForm').reset();
      document.getElementById('date').value = todayStr();
      syncRecordCurrency();
      updateRecordFormUI();
    }

    function deleteEditingRecord() {
      if (!editingId) return;
      if (!confirm('确定删除这条账单吗？删除后无法恢复。')) return;
      const records = loadData('records', []).filter(r => r.id !== editingId);
      saveData('records', records);
      cancelEdit();
      renderAll();
    }

    // ===== 账户操作 & 初始余额 =====
    function deleteAccount(id) {
      if (!confirm('删除账户后，相关历史账单仍保留，但无法再对其进行记账。确定删除？')) return;
      ACCOUNTS = ACCOUNTS.filter(a => a.id !== id);
      saveData('accounts', ACCOUNTS);
      renderAll();
      renderAccountOptions();
    }

    document.getElementById('addAccountForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('newAccountName').value.trim();
      const subType = document.getElementById('newAccountSubType').value;
      const currency = document.getElementById('newAccountCurrency').value;
      
      ACCOUNTS.push({ id: Date.now().toString(), name, subType, currency });
      saveData('accounts', ACCOUNTS);
      this.reset();
      
      renderAll();
      renderAccountOptions();
    });

    function toggleBalanceEditor() {
      const editor = document.getElementById('balanceEditor');
      if (editor.style.display === 'none' || editor.style.display === '') {
        renderBalanceEditor();
        editor.style.display = 'block';
      } else {
        editor.style.display = 'none';
      }
    }

    function renderBalanceEditor() {
      const editor = document.getElementById('balanceEditor');
      const balances = loadData('initialBalances', {});
      editor.innerHTML = '';
      if (ACCOUNTS.length === 0) {
        editor.innerHTML = '<p style="font-size:12px; color:#666; text-align:center;">请先添加账户</p>';
        return;
      }
      ACCOUNTS.forEach(acc => {
        const row = document.createElement('div');
        row.className = 'editor-row';
        row.innerHTML = `<span>${acc.name}</span><input type="number" id="bal_${acc.id}" step="0.01" value="${balances[acc.id] || 0}">`;
        editor.appendChild(row);
      });
      const saveBtn = document.createElement('button');
      saveBtn.className = 'primary';
      saveBtn.style.marginTop = '10px';
      saveBtn.textContent = LANGS[currentLang].saveBalance || '保存初始余额';
      saveBtn.onclick = () => {
        const newBalances = {};
        ACCOUNTS.forEach(acc => {
          newBalances[acc.id] = parseFloat(document.getElementById(`bal_${acc.id}`).value) || 0;
        });
        saveData('initialBalances', newBalances);
        editor.style.display = 'none';
        renderAll();
        alert('初始余额已保存！');
      };
      editor.appendChild(saveBtn);
    }

    // ===== 数据备份与恢复 =====
    function exportData() {
      const data = {
        accounts: loadData('accounts', []),
        records: loadData('records', []),
        transfers: loadData('transfers', []),
        initialBalances: loadData('initialBalances', {})
      };
      const str = JSON.stringify(data);
      
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(str).then(() => {
          alert('✅ 备份已成功复制到剪贴板！\n\n请打开微信“文件传输助手”或备忘录，粘贴并发送保存。');
        }).catch(() => {
          fallbackExport(str);
        });
      } else {
        fallbackExport(str);
      }
    }

    function fallbackExport(str) {
      document.getElementById('importArea').style.display = 'block';
      const textarea = document.getElementById('importText');
      textarea.value = str;
      textarea.select();
      document.execCommand('copy');
      alert('✅ 备份已生成并自动全选。\n\n由于浏览器限制，请手动长按复制上方文本框的内容并保存。');
      window.scrollTo(0, document.body.scrollHeight);
    }

    function toggleImport() {
      const area = document.getElementById('importArea');
      area.style.display = area.style.display === 'none' ? 'block' : 'none';
    }

    function doImport() {
      const str = document.getElementById('importText').value.trim();
      if (!str) { alert('请先粘贴备份数据'); return; }
      
      try {
        const data = JSON.parse(str);
        if (!data.accounts || !data.records) throw new Error('数据格式不正确');
        
        if (confirm('⚠️ 警告：导入将覆盖当前所有数据和账户，且不可逆！确定要恢复吗？')) {
          saveData('accounts', data.accounts || []);
          saveData('records', data.records || []);
          saveData('transfers', data.transfers || []);
          saveData('initialBalances', data.initialBalances || {});
          
          alert('✅ 数据恢复成功！页面即将刷新。');
          window.location.reload();
        }
      } catch (e) {
        alert('❌ 导入失败：复制的数据不完整或格式有误，请检查。');
      }
    }

    // ===== 多语言切换核心逻辑 =====
    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.getElementById('langSelect').value = lang;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (LANGS[lang][key]) el.textContent = LANGS[lang][key];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (LANGS[lang][key]) el.placeholder = LANGS[lang][key];
      });

      renderCategoryOptions();
      renderAccountOptions(); // 内部会刷新查询账户下拉
      renderAll();
      updateRecordFormUI(); // 恢复编辑态标题与按钮
    }

    // ===== 底部导航栏 =====
    function switchTab(pageId, btnEl, bgColor) {
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      btnEl.classList.add('active');

      document.body.style.backgroundColor = bgColor;
      window.scrollTo(0, 0);
    }

    // ===== 事件监听 =====
    document.getElementById('langSelect').addEventListener('change', function(e) { applyLanguage(e.target.value); });

    // 选择账户时自动切换币种
    document.getElementById('account').addEventListener('change', syncRecordCurrency);
    // 转账「从」账户变化时同步币种并过滤「到」账户
    document.getElementById('fromAccount').addEventListener('change', syncTransferCurrency);

    document.getElementById('recordForm').addEventListener('submit', function (e) {
      e.preventDefault();
      if (ACCOUNTS.length === 0) { alert('请先在【资产】页底部添加账户'); return; }
      const amount = parseFloat(document.getElementById('amount').value);
      if (!amount || amount <= 0) return;
      
      const accountId = document.getElementById('account').value;
      const account = ACCOUNTS.find((a) => a.id === accountId);
      if (!account) { alert('请选择一个有效账户'); return; }

      const records = loadData('records', []);
      const payload = {
        amount,
        currency: account.currency, // 始终跟随账户币种
        type: document.getElementById('type').value,
        accountId,
        accountName: account.name,
        category: document.getElementById('category').value,
        date: document.getElementById('date').value,
        note: document.getElementById('note').value.trim()
      };

      if (editingId) {
        const idx = records.findIndex(r => r.id === editingId);
        if (idx >= 0) {
          records[idx] = { ...records[idx], ...payload, updatedAt: Date.now() };
          saveData('records', records);
          cancelEdit();
          renderAll();
          alert('✅ 修改已保存');
          return;
        }
      }

      records.push({ id: Date.now(), ...payload, createdAt: Date.now() });
      saveData('records', records);
      this.reset();
      document.getElementById('date').value = todayStr();
      syncRecordCurrency();
      renderAll();
    });

    document.getElementById('transferForm').addEventListener('submit', function (e) {
      e.preventDefault();
      if (ACCOUNTS.length < 2) { alert('至少需要两个账户才能转账'); return; }
      const amount = parseFloat(document.getElementById('transferAmount').value);
      if (!amount || amount <= 0) return;
      
      const from = document.getElementById('fromAccount').value; 
      const to = document.getElementById('toAccount').value;
      const fromAcc = ACCOUNTS.find((a) => a.id === from); 
      const toAcc = ACCOUNTS.find((a) => a.id === to);
      
      if (!fromAcc || !toAcc) { alert('请选择有效的转出与转入账户'); return; }
      if (from === to) { alert('不能转给同一个账户'); return; }
      if (fromAcc.currency !== toAcc.currency) { alert('不支持跨币种转账'); return; }

      const transfers = loadData('transfers', []);
      transfers.push({
        id: Date.now(), from, to, fromName: fromAcc.name, toName: toAcc.name, amount,
        currency: fromAcc.currency, // 跟随转出账户币种
        date: document.getElementById('transferDate').value,
        note: document.getElementById('transferNote').value.trim(),
        createdAt: Date.now()
      });
      saveData('transfers', transfers);
      this.reset();
      document.getElementById('transferDate').value = todayStr();
      renderAccountOptions(); // 重置下拉后重新联动
      renderAll();
    });

    // ===== 启动 =====
    document.getElementById('date').value = todayStr();
    document.getElementById('transferDate').value = todayStr();
    setRange('thisMonth');
    applyLanguage(currentLang);
    runQuery(); // 初始展示本月全部账户明细
    
    if(ACCOUNTS.length === 0) {
      setTimeout(() => alert('欢迎！请先点击底部的【资产】页，在下方添加属于你的账户。'), 500);
    }
  </script>
</body>
</html>
